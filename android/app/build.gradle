plugins {
    id 'com.android.application'
}

def webHost = (project.findProperty('webHost') ?: 'ssemtke25-png.github.io').toString()
def webBase = (project.findProperty('webBase') ?: '/kijun/').toString()
def verCode = (project.findProperty('verCode') ?: '1').toString().toInteger()

android {
    namespace 'io.github.ssemtke25.kijun'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.ssemtke25.kijun'
        minSdk 26
        targetSdk 34
        versionCode verCode
        versionName "1.0.${verCode}"
        buildConfigField "String", "WEB_HOST", "\"${webHost}\""
        buildConfigField "String", "WEB_BASE", "\"${webBase}\""
    }

    signingConfigs {
        fixed {
            storeFile file('kijun.keystore')
            storePassword 'kijun123'
            keyAlias 'kijun'
            keyPassword 'kijun123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
